<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in — DataPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#070d1a;--ink2:#0e1624;--rim:rgba(255,255,255,.07);--rim2:rgba(255,255,255,.13);
  --gold:#c9a84c;--gold2:#e8c96a;--gold-glow:rgba(201,168,76,.3);
  --text:#dce6f5;--text2:#7a92b4;--text3:#3d5270;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{width:380px;max-width:90vw;background:var(--ink2);border:1px solid var(--rim);border-radius:20px;
  padding:40px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo-mark{width:52px;height:52px;border-radius:14px;margin:0 auto 18px;background:linear-gradient(135deg,var(--gold),#f0a44a);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--ink);
  box-shadow:0 4px 18px var(--gold-glow)}
h1{font-size:19px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
.sub{font-size:12.5px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:28px}
p.lead{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:26px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;
  background:#fff;color:#1f1f1f;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;
  transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.note{margin-top:22px;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.err{margin-top:18px;padding:10px 12px;border-radius:8px;background:rgba(224,92,122,.12);
  border:1px solid rgba(224,92,122,.25);color:#e05c7a;font-size:12.5px}
</style>
</head>
<body>
<div class="card">
  <div class="logo-mark">D</div>
  <h1>DataPulse</h1>
  <div class="sub">Adit Pay Intelligence</div>
  <p class="lead">Sign in with your <b>@adit.com</b> Google account to access the dashboard.</p>
  <a class="btn" href="/auth/google">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    Sign in with Google
  </a>
  <div class="note">Access limited to Adit team accounts</div>
</div>
</body>
</html>
